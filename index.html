<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETI AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10141c;
    color: white;
}

.app {
    max-width: 600px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 18px;
    background: #171d28;
    border-bottom: 1px solid #303846;
}

.title {
    font-size: 22px;
    font-weight: bold;
}

.subtitle {
    font-size: 12px;
    color: #9ba5b5;
    margin-top: 4px;
}

.chat {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin-bottom: 12px;
    border-radius: 14px;
    line-height: 1.4;
}

.beti {
    background: #202735;
    border-bottom-left-radius: 4px;
}

.user {
    background: #315f9f;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #171d28;
    border-top: 1px solid #303846;
}

input {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #252d3a;
    color: white;
    outline: none;
}

button {
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    background: #3976c6;
    color: white;
    font-weight: bold;
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">🤖 BETI AI</div>
        <div class="subtitle">Personal AI Assistant</div>
    </div>

    <div class="chat" id="chat">

        <div class="message beti">
            Halo 👋<br><br>
            Saya <b>Beti</b>, assistant pribadi kamu.
            <br><br>
            Kita mulai dari sini dan nanti bisa dikembangkan menjadi AI
            yang menangani berbagai kebutuhan kamu.
        </div>

    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Tulis pesan..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button onclick="sendMessage()">Kirim</button>
    </div>

</div>

<script>

async function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if (text === "") return;

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.innerText = text;

    chat.appendChild(userMessage);

    input.value = "";

    const betiMessage = document.createElement("div");
    betiMessage.className = "message beti";
    betiMessage.innerText = "Beti sedang berpikir...";
    chat.appendChild(betiMessage);

    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Terjadi kesalahan");
        }

        betiMessage.innerText = data.reply;

    } catch (error) {
        betiMessage.innerText =
            "Maaf Bet, terjadi masalah saat menghubungkan ke mesin AI.";
        console.error(error);
    }

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
